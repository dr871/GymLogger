<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>GymLogger</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="description" content="Offline workout tracker — see what you lifted last time, right where you log today.">
<meta name="theme-color" content="#101216">
<meta name="color-scheme" content="dark">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GymLogger">
<link rel="stylesheet" href="./styles.css">
</head>
<body>

<main id="app"></main>

<div id="timerbar" hidden>
  <div id="timer-fill"></div>
  <div class="timer-inner">
    <div class="timer-text">
      <strong id="timer-time">0:00</strong>
      <span id="timer-label"></span>
    </div>
    <button class="timer-btn" data-act="timer-add">+30s</button>
    <button class="timer-btn" data-act="timer-cancel" aria-label="Cancel rest timer">✕</button>
  </div>
</div>

<nav class="tabs">
  <button class="tab on" data-tab="home" data-act="go" data-to="home">
    <span class="tab-i" aria-hidden="true">▲</span><span>Home</span>
  </button>
  <button class="tab" data-tab="history" data-act="go" data-to="history">
    <span class="tab-i" aria-hidden="true">☰</span><span>History</span>
  </button>
  <button class="tab" data-tab="progress" data-act="go" data-to="progress">
    <span class="tab-i" aria-hidden="true">◪</span><span>Progress</span>
  </button>
  <button class="tab" data-tab="settings" data-act="go" data-to="settings">
    <span class="tab-i" aria-hidden="true">⚙</span><span>Settings</span>
  </button>
</nav>

<script type="module" src="./js/app.js"></script>
</body>
</html>
