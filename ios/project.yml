# Fallback project generator. The checked-in GymLogger.xcodeproj is the primary
# way in; if it ever goes stale, `brew install xcodegen && xcodegen generate`
# rebuilds an equivalent one from this spec.
name: GymLogger
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
targets:
  GymLogger:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - GymLogger
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.GymLogger
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
